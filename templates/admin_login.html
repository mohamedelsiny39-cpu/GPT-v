<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>دخول الأدمن - CanCel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <h1>لوحة تحكم CanCel</h1>
    <p class="login-sub">دخول الأدمن فقط</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="كلمة السر" autofocus required />
    <button type="submit">دخول</button>
  </form>
</body>
</html>
